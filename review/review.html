<!doctype html><meta charset="utf-8"><title>Draft diagrams</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  body{margin:0;padding:24px;font:15px system-ui,sans-serif;background:#fff;color:#111;width:1500px}
  h1{font-size:22px;margin:0 0 4px} p.sub{margin:0 0 16px;color:#555}
  .row{display:grid;gap:14px;margin-bottom:36px} .card{border:1px solid #ccc;border-radius:8px;padding:8px}
  .card.new{border:3px solid #d33} .card b{display:block;margin-bottom:4px} .card p{margin:6px 0 0;font-size:13px;line-height:1.35}
  svg.wb .arrows.fade{animation:none}
  .card svg{width:100%;height:auto;display:block}
</style>
<div id="out"></div>
<script src="../js/court.js"></script><script src="draft.js"></script>
<script>
const only = new URLSearchParams(location.search).get('id');
const titles = { 'TR-11': ['5-Man Criss-Cross Transition (draft)', 'Full court, 5 on 0, five trips. Each board shows one trip: players are drawn where the trip starts, arrows show where they go. Solid = run, zigzag = dribble, dashed = pass.'],
  'PL-18': ['4-Out Corner-Cut Motion (already in the app) + the new post flash', 'Half court. The red-outlined step is the only thing I would add.'] };
for (const [id, dg] of Object.entries(DRAFT)) {
  if (only && only !== id) continue;
  const n = dg.s.length, sec = document.createElement('section');
  sec.innerHTML = `<h1>${titles[id][0]}</h1><p class="sub">${titles[id][1]}</p><div class="row" style="grid-template-columns:repeat(${dg.court ? n : 4},1fr)"></div>`;
  out.append(sec);
  dg.s.forEach((st, i) => {
    const c = document.createElement('div');
    c.className = 'card' + (st[0].startsWith('NEW') ? ' new' : '');
    c.innerHTML = `<b>Step ${i + 1}</b><div class="m"></div><p>${st[0]}</p>`;
    sec.querySelector('.row').append(c);
    Court.mount(c.querySelector('.m'), { ...dg, id }).go(i);
  });
}
</script>
